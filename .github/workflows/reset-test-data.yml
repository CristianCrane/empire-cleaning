name: Reset test data

# Run by hand (Actions → Reset test data → Run workflow): replaces the test
# site's data with the dev seed (packages/server/tests/seed.ts). Accounts and
# the Price List stay, so whoever has signed up stays signed up. It tries the
# reset on a copy of the test database first, so a seed that would fail
# leaves the test site as it was (#238).
on:
  workflow_dispatch:

permissions:
  contents: read

# never two at once against the same database
concurrency:
  group: reset-test-data

jobs:
  reset:
    name: Reseed the test database
    runs-on: ubuntu-latest
    env:
      APP_MODE: test
      # the seed fakes email, payments and the clock, but the server still
      # checks every variable is set (src/env.ts)
      CORS_ORIGIN_URL: https://app.test.empirecleaningandpro.com
      BETTER_AUTH_URL: https://app.test.empirecleaningandpro.com
      LANDING_ORIGIN_URL: https://test.empirecleaningandpro.com
      OFFICE_EMAIL: empirecleaningproservices@gmail.com
      RESEND_API_KEY: unused
      BETTER_AUTH_SECRET: unused-by-the-seed-but-32-characters-long
      GOOGLE_CLIENT_ID: unused
      GOOGLE_CLIENT_SECRET: unused
      STRIPE_SECRET_KEY: unused
      STRIPE_PUBLISHABLE_KEY: unused
      STRIPE_WEBHOOK_SECRET: unused
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # the copy and the test site are seeded as if at the same moment, as
      # where the seed's cleans fall turns on the day and time
      - name: Choose when the seed runs as
        run: echo "SEED_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # the test database whole, with the Accounts, Price List and Services a
      # reset keeps, into the test Postgres here (docker-compose.yml). Its
      # pg_dump is Postgres 16, as Render's is (render.yaml)
      - name: Copy the test database
        # bash, so a pg_dump that fails fails the step (pipefail)
        shell: bash
        run: |
          docker compose up --detach --wait postgres_test
          docker exec empire_postgres_test createdb -U postgres reset_copy_test
          docker exec empire_postgres_test pg_dump --no-owner --no-privileges "$TEST_DB_URL" |
            docker exec -i empire_postgres_test psql -U postgres -d reset_copy_test --quiet --output=/dev/null --set ON_ERROR_STOP=1
        env:
          # the test database's external URL from Render, ending
          # ?sslmode=require
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
      - name: Reset the copy
        run: pnpm db:seed --reset
        env:
          DB_URL: postgresql://postgres:password@localhost:5433/reset_copy_test
      - name: Reset the test site
        run: pnpm db:seed --reset
        env:
          DB_URL: ${{ secrets.TEST_DB_URL }}
