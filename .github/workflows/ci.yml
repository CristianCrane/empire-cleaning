name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# a newer push to a pull request cancels the run still going; runs on main
# each finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No secrets: email, payments and the clock are faked in tests. The jobs that
# need Postgres each start the test one from docker-compose.yml (port 5433, in
# memory, disk syncing off), so they run in parallel without sharing a database.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Unused files, exports and dependencies
        run: pnpm lint:unused
      - name: Formatting
        run: pnpm format:check
      - name: Package consistency
        run: pnpm check:packages
      # a schema change merged without its migration, or a schema file that
      # loads the server's environment (#389): generating needs nothing set
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          changed=$(git status --porcelain packages/server/drizzle)
          if [ -n "$changed" ]; then echo "$changed"; echo "run pnpm db:generate and commit the migration"; exit 1; fi
      # our own lint rules, through oxlint's RuleTester (packages/lint)
      - name: Lint rule tests
        run: pnpm --filter @empire-cleaning/lint test
      # what may reach Sentry and the logs, and the browsers' Sentry setup
      - name: Scrubbing tests
        run: pnpm --filter @empire-cleaning/models --filter @empire-cleaning/browser-monitoring test

  # Each suite that's split across jobs (a matrix of shards) says how many in
  # its matrix alone; its name and its share read the count from
  # strategy.job-total. CI's wall time is its slowest job (#315).

  # the server's test files shared out between jobs (Vitest's --shard)
  server:
    name: Server tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: docker compose up --detach --wait postgres_test
      # the seed test has jobs of its own (below)
      - run: pnpm --filter @empire-cleaning/server test:quick --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The seed as the test site's reset runs it, at 28 days and times
  # (packages/server/tests/seed.test.ts), shared out between jobs
  # (SEED_SHARD). Jobs of their own, as after the server's tests it doubled
  # that job, and with the runner to itself, 4 seeds at a time, not the 2 a
  # 4-core runner's tests get.
  seed:
    name: Seed test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: docker compose up --detach --wait postgres_test
      - run: pnpm --filter @empire-cleaning/server test:seed
        env:
          SERVER_TEST_WORKERS: 4
          SEED_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  ui:
    name: Design-system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm --filter @empire-cleaning/ui test

  # the slowest suite, so it's split across jobs, each running a share of the
  # tests in parallel (packages/web/e2e/slots.ts)
  web:
    name: Web end-to-end tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: docker compose up --detach --wait postgres_test
      # the few browser tests in src/, once
      - if: matrix.shard == 1
        run: pnpm --filter @empire-cleaning/web exec vitest run
      - run: pnpm --filter @empire-cleaning/web exec playwright test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-report-${{ matrix.shard }}
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 14

  landing:
    name: Landing site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: docker compose up --detach --wait postgres_test
      - run: pnpm --filter @empire-cleaning/landing test
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: landing-playwright-report
          path: |
            packages/landing/playwright-report
            packages/landing/test-results
          retention-days: 14

  # The one check main requires: every job above passed. Shards can come and
  # go without touching the branch's settings. It runs even when a job it
  # needs failed (else it would be skipped, which counts as passing) and
  # fails unless each one succeeded. Actions can't say "every job", so a new
  # job must join `needs`, or nothing requires it.
  all:
    name: All checks
    if: ${{ !cancelled() }}
    needs: [checks, server, seed, ui, web, landing]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<< "$RESULTS"
