# The test environment on Render (ADR-0020): the server, its Postgres, and
# the web app and landing static sites. Production is the same services in a
# Blueprint of its own, render-production.yaml, only ever deployed by hand. A
# change here goes there too, unless it's one of the differences
# packages/server/src/render-blueprints.test.ts lists, which fails otherwise.
#
# Secret values are entered in Render's dashboard when the Blueprint is first
# created (the `sync: false` ones; #130 lists where each comes from).
#
# Render has no pnpm of its own, so the builds run the version pinned in
# package.json's `packageManager` through npx; the server's commands run its
# package.json scripts through npm.

databases:
  - name: empire-test-db
    plan: basic-256mb
    region: virginia
    # the same as docker-compose.yml
    postgresMajorVersion: "16"
    # reachable from outside Render (password required) so the reset Action
    # can reseed it from GitHub, whose runners have no fixed address

services:
  - type: web
    name: empire-test-server
    runtime: node
    # always on: the scheduled runs live in the server process (src/index.ts)
    plan: starter
    region: virginia
    buildCommand: npx --yes pnpm@11.18.0 install --frozen-lockfile
    # migrations run on every deploy, before the new server starts, and only
    # once the server's environment is whole: db:migrate reads DB_URL alone
    preDeployCommand: npm --prefix packages/server run env:check && npm --prefix packages/server run db:migrate
    startCommand: npm --prefix packages/server start
    healthCheckPath: /health
    # Render's build minutes are capped, so the test site deploys once a night,
    # not on every merge: the Deploy test site Action
    # (.github/workflows/deploy-test-site.yml) deploys each service at main's
    # newest commit that passed CI, when a file it's built from changed since
    # its last good deploy. Its run by hand deploys at once. A change to this
    # file is the exception: Render's Blueprint sync deploys what it changes at
    # the merge, before CI (render.com/docs/infrastructure-as-code).
    autoDeployTrigger: "off"
    # The files each service is built from, which the nightly Action reads
    # (Render reads them only for its own auto-deploys, now off): its packages
    # (from their package.json dependencies) and the root files every install
    # reads, but never docs, tests or stories, which no build ships. An
    # ignored path wins over an included one (render.com/docs/monorepo-support).
    # The ignore list is the same in each service (no YAML anchors: ADR-0020)
    buildFilter:
      paths:
        - packages/server/**
        - packages/models/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - tsconfig.json
      ignoredPaths:
        - "**/*.md"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.stories.tsx"
        - "**/vitest*.config.ts"
        - "**/playwright*.config.ts"
        - "**/tests/**"
        - "**/e2e/**"
        - packages/ui/.storybook/**
        # react-email's previews (`pnpm email:dev`)
        - packages/server/emails/**
    envVars:
      - key: APP_MODE
        value: test
      - key: DB_URL
        fromDatabase:
          name: empire-test-db
          property: connectionString
      # the web app: sign-in links, Stripe's webhook and the landing form all
      # reach the API at its /api
      - key: CORS_ORIGIN_URL
        value: https://app.test.empirecleaningandpro.com
      - key: BETTER_AUTH_URL
        value: https://app.test.empirecleaningandpro.com
      - key: LANDING_ORIGIN_URL
        value: https://test.empirecleaningandpro.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: Empire Cleaning <test@empirecleaningandpro.com>
      - key: OFFICE_EMAIL
        value: empirecleaningproservices@gmail.com
      # the Office inbox's +aliases, which everyone in the seed data has; Ingrid,
      # who tests as Office Staff; and Cris and their +aliases, one per role. Mail
      # to anyone else goes to the Office inbox
      - key: EMAIL_ALLOWED
        value: empirecleaningproservices+*@gmail.com,ivm4301@gmail.com,cristiandcrane@gmail.com,cristiandcrane+*@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # the test site's own Stripe sandbox (#45)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Google's write-a-review link, from the Business Profile (#174); left
      # empty, no Client is asked for a review (#175)
      - key: GOOGLE_REVIEW_URL
        sync: false
      # the server's Sentry project (#43); left empty, errors are only logged
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: empire-test-web
    runtime: static
    buildCommand: >-
      npx --yes pnpm@11.18.0 install --frozen-lockfile &&
      npx --yes pnpm@11.18.0 --filter-prod "@empire-cleaning/web..." build
    staticPublishPath: packages/web/dist
    # nightly, as the server's comment says
    autoDeployTrigger: "off"
    # its dependencies; the server, a devDependency, is only its e2e tests'
    buildFilter:
      paths:
        - packages/web/**
        - packages/ui/**
        - packages/quote-request/**
        - packages/browser-monitoring/**
        - packages/models/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - tsconfig.json
      ignoredPaths:
        - "**/*.md"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.stories.tsx"
        - "**/vitest*.config.ts"
        - "**/playwright*.config.ts"
        - "**/tests/**"
        - "**/e2e/**"
        - packages/ui/.storybook/**
        - packages/server/emails/**
    domains:
      - app.test.empirecleaningandpro.com
    # what a page can't say for itself in a <meta>: no other site may
    # frame the app (clickjacking), HTTPS only, files are what they say they are,
    # and other sites learn only which site a visitor came from, never the page,
    # whose address can hold a sign-in link
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Sentry's environment
      - key: VITE_APP_MODE
        value: test
      # the landing site, whose policies sign-in links (#462): the same
      # address as the server's LANDING_ORIGIN_URL
      - key: VITE_LANDING_URL
        value: https://test.empirecleaningandpro.com
      # the web project's Sentry DSN (#43); left empty, nothing is sent
      - key: VITE_SENTRY_DSN
        sync: false
      # to upload source maps (#43); left empty, there are none
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
    routes:
      # the API on the app's own origin, so sign-in cookies just work: a
      # rewrite, not a redirect. Render names the server's address after the
      # service, so it must match the name above
      - type: rewrite
        source: /api/*
        destination: https://empire-test-server.onrender.com/api/*
      # every other path is one of the app's pages
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: empire-test-landing
    runtime: static
    buildCommand: >-
      npx --yes pnpm@11.18.0 install --frozen-lockfile &&
      npx --yes pnpm@11.18.0 --filter-prod "@empire-cleaning/landing..." build
    staticPublishPath: packages/landing/dist
    # nightly, as the server's comment says
    autoDeployTrigger: "off"
    # its dependencies; the server, a devDependency, is only its tests'
    buildFilter:
      paths:
        - packages/landing/**
        - packages/ui/**
        - packages/quote-request/**
        - packages/browser-monitoring/**
        - packages/models/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - tsconfig.json
      ignoredPaths:
        - "**/*.md"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.stories.tsx"
        - "**/vitest*.config.ts"
        - "**/playwright*.config.ts"
        - "**/tests/**"
        - "**/e2e/**"
        - packages/ui/.storybook/**
        - packages/server/emails/**
    domains:
      - test.empirecleaningandpro.com
    # what a page can't say for itself in a <meta>: no other site may
    # frame the site (clickjacking), HTTPS only, files are what they say they are,
    # and other sites learn only which site a visitor came from, never the page
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # the banner and no indexing (src/site-mode.ts)
      - key: PUBLIC_APP_MODE
        value: test
      # where the Quote form posts
      - key: PUBLIC_API_URL
        value: https://app.test.empirecleaningandpro.com
      # where the header's Sign in goes (src/app-url.ts)
      - key: PUBLIC_APP_URL
        value: https://app.test.empirecleaningandpro.com
      # the landing project's Sentry DSN (#43); left empty, nothing is sent
      - key: PUBLIC_SENTRY_DSN
        sync: false
      # to upload source maps (#43); left empty, there are none
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
