services:
  postgres:
    image: postgres:16-alpine
    container_name: empire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: empire_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empire_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
